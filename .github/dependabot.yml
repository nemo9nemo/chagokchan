version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "22:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "22:45"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
