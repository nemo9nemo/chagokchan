<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3eb">
    <title>오프라인 · 차곡찬</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f3eb; color: #203b34; font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #d7e2d5; border-radius: 24px; background: #fffefa; text-align: center; }
      h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 6vw, 2rem); }
      p { margin: 0; color: #53685f; line-height: 1.75; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 24px; padding: 0 18px; border-radius: 12px; background: #24594a; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결이 필요해요</h1>
      <p>다시 연결한 뒤 차곡찬을 열어 주세요. 오프라인에서 보낸 기록은 저장되거나 성공으로 표시되지 않아요.</p>
      <a href="/">다시 연결하기</a>
    </main>
  </body>
</html>
